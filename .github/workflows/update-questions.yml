name: Auto Extract & Update Questions

on:
  push:
    paths:
      - 'html/**'
      - 'questions.md'
      - 'scripts/extract.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Extraction & Deduplication
        run: node scripts/extract.mjs

      - name: Commit and Push Updated Question Bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/questions.json data/questions.js
          if git diff --staged --quiet; then
            echo "No changes in questions data."
          else
            git commit -m "chore(auto): extract and deduplicate questions [skip ci]"
            git push
          fi

